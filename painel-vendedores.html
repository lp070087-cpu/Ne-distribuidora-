<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MaxDistrib · Painel do Vendedor</title>
<link rel="icon" type="image/png" href="assets/ne-favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/ds.css">
<script src="assets/ds.js"></script>
<script src="/assets/chart.umd.js"></script>
<style>
.meta-bar{background:var(--canvas-2);border-radius:var(--r);height:12px;overflow:hidden;margin:var(--s2) 0}
.meta-fill{height:100%;background:var(--gold);border-radius:var(--r);transition:width .5s var(--ease)}
.meta-info{display:flex;justify-content:space-between;gap:var(--s2);flex-wrap:wrap;font-size:var(--fs-sm);color:var(--muted)}
.meta-info strong{color:var(--ink)}
.meta-ctl{display:flex;gap:var(--s3);align-items:center}
.meta-ctl input[type=number]{width:120px;flex:none}
input[type=range]{flex:1;min-width:0;appearance:none;height:6px;background:var(--canvas-2);border-radius:3px}
input[type=range]::-webkit-slider-thumb{appearance:none;width:20px;height:20px;border-radius:50%;background:var(--brand-primary-text);border:3px solid var(--gold);cursor:pointer}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--brand-primary-text);border:3px solid var(--gold);cursor:pointer}
.link-box{background:var(--canvas);border:1px dashed var(--line-2);border-radius:var(--r);padding:var(--s3);display:flex;align-items:center;justify-content:space-between;gap:var(--s2);flex-wrap:wrap;font-family:var(--mono);font-size:var(--fs-sm);overflow-wrap:anywhere}
.link-box span{min-width:0}.link-box strong{color:var(--ink)}
.link-note{font-size:var(--fs-sm);color:var(--muted);margin-bottom:var(--s3)}
.link-acts{display:flex;gap:var(--s2);margin-top:var(--s3);flex-wrap:wrap}
.client-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s3) var(--s4);margin-bottom:var(--s2);cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:var(--s3);width:100%;text-align:left;transition:border-color var(--t-fast),box-shadow var(--t-fast)}
.client-card:hover{border-color:var(--line-2);box-shadow:var(--sh-2)}
.client-card .cl-main{min-width:0;display:flex;align-items:center;gap:var(--s3)}
.client-card .cl-name{font-weight:600;color:var(--ink);font-size:var(--fs-md)}
.client-card .cl-note{font-size:var(--fs-xs);color:var(--muted);margin-top:2px}
.client-card .cl-stats{text-align:right;font-size:var(--fs-xs);color:var(--muted);flex:none}
.client-card .cl-stats strong{display:block;color:var(--ink);font-size:var(--fs-md);font-variant-numeric:tabular-nums}
.sec-t{font-size:var(--fs-md);font-weight:700;margin-bottom:var(--s3);letter-spacing:0}
.detail-hd{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s4)}
.detail-hd h2{font-size:var(--fs-xl)}
.mb{margin-bottom:var(--s4)}
.rank-pos{font-family:var(--ff-d);font-weight:700;color:var(--muted)}
.rank-pos.top{color:var(--gold-text)}
tr.me{background:var(--gold-soft)}tr.me:hover{background:var(--gold-soft)}
.rank-foot{font-size:var(--fs-sm);color:var(--muted);text-align:center}
.rank-foot strong{color:var(--ink)}
.chart-box{height:220px}
.chart-box.sm{height:180px}
@media(max-width:640px){.meta-ctl{flex-wrap:wrap}.meta-ctl input[type=number]{width:100%}.client-card .cl-note{white-space:normal}}
.topbar-l{gap:var(--s3)}
.topbar .mob-btn{order:2;flex:none}
.page-title{font-family:var(--ff-d);letter-spacing:-.025em}
.demo-context{display:inline-flex;align-items:center;flex:none;border:1px solid var(--line);border-radius:var(--r-full);padding:4px 9px;background:var(--canvas);color:var(--muted);font-size:var(--fs-xs);font-weight:600}
.chart-row>*{min-width:0}
.chart-unavailable{display:grid;place-items:center;height:100%;padding:var(--s3);text-align:center;color:var(--muted);font-size:var(--fs-sm)}
.client-card .cl-name,.link-box span,.detail-hd h2{overflow-wrap:anywhere}
.sidebar-link,.client-card,.mob-btn{min-height:44px}
.sidebar-link:focus-visible,.client-card:focus-visible,.mob-btn:focus-visible{outline:2px solid var(--gold-text);outline-offset:2px}
@media(max-width:900px){
  .topbar{padding-inline:max(12px,env(safe-area-inset-left)) max(12px,env(safe-area-inset-right))}
  .topbar-l{flex:1}
  .mob-btn{width:44px}
  .sidebar{inset-inline:auto 0;width:min(300px,calc(100vw - 52px));transform:translateX(100%);visibility:hidden}
  .sidebar.open{transform:none;visibility:visible}
}
@media(max-width:640px){
  .chart-card,.fcard{padding:var(--s3)}
  .chart-box{height:190px}
  .modal-ft .btn,.link-acts .btn{min-height:44px}
}

.internal-ne-logo{display:block;object-fit:contain;width:142px;height:auto;max-width:100%;padding:6px 8px;background:var(--brand-white);border-radius:5px}
.sidebar-head{min-height:72px;height:auto;align-items:flex-start;justify-content:center;flex-direction:column;gap:5px}.sidebar-head small{color:var(--brand-muted)}
</style>
</head>
<body class="app">

<div class="overlay" id="overlay" onclick="toggleSidebar(true)"></div>

<aside class="sidebar" id="sidebar" aria-label="Menu do painel">
  <div class="sidebar-head"><img class="internal-ne-logo" src="assets/ne-logo.png" width="616" height="110" alt="NE Distribuidora"><small>Painel do Vendedor</small></div>
  <nav class="sidebar-nav">
    <button class="sidebar-link stag-link on" data-tag="dash" data-ic="dash" onclick="openTag('dash')">Visão geral</button>
    <button class="sidebar-link stag-link" data-tag="pedidos" data-ic="list" onclick="openTag('pedidos')">Pedidos por cliente</button>
    <button class="sidebar-link stag-link" data-tag="clientes" data-ic="users" onclick="openTag('clientes')">Meus clientes</button>
    <button class="sidebar-link stag-link" data-tag="link" data-ic="link" onclick="openTag('link')">Meu link</button>
    <button class="sidebar-link stag-link" data-tag="metas" data-ic="target" onclick="openTag('metas')">Minhas metas</button>
    <button class="sidebar-link stag-link" data-tag="rank" data-ic="trophy" onclick="openTag('rank')">Ranking</button>
  </nav>
  <div class="sidebar-foot"><div class="sidebar-av">LS</div><div><strong>Lucas Silva</strong><small>Vendedor</small></div></div>
</aside>

<main class="main">
  <div class="topbar">
    <div class="topbar-l">
      <h1 class="page-title" id="breadcrumb">Visão geral</h1>
    </div>
    <span class="demo-context">Demonstração</span>
    <button class="btn btn-gh btn-ic mob-btn" id="vendorMenuButton" aria-label="Abrir menu" aria-controls="sidebar" aria-expanded="false" data-ic="menu" onclick="toggleSidebar()"></button>
  </div>
  <div class="content" id="pageRoot"></div>
</main>

<div class="modal-ov" id="modalOverlay"><div class="modal" id="modalBody" role="dialog" aria-modal="true"></div></div>

<script>
var VENDOR_NAME = 'Lucas Silva';

// Mock data - orders by client
var allOrders = [
  {id:1,client:'Mateus Oliveira',product:'Whey Protein 900g',qty:5,price:149.90,date:'2026-07-01',status:'retirado'},
  {id:2,client:'Mateus Oliveira',product:'Creatina 300g',qty:3,price:89.90,date:'2026-07-03',status:'retirado'},
  {id:3,client:'Mateus Oliveira',product:'Multivitamínico',qty:2,price:54.90,date:'2026-07-05',status:'retirado'},
  {id:4,client:'Ana Beatriz',product:'Creatina 300g',qty:3,price:89.90,date:'2026-07-01',status:'retirado'},
  {id:5,client:'Ana Beatriz',product:'Pré-Treino Égide',qty:2,price:109.90,date:'2026-07-04',status:'separando'},
  {id:6,client:'Carlos Eduardo',product:'Whey Protein 900g',qty:6,price:149.90,date:'2026-07-02',status:'retirado'},
  {id:7,client:'Carlos Eduardo',product:'Barra Proteína Cx12',qty:3,price:154.80,date:'2026-07-05',status:'pendente'},
  {id:8,client:'Fernanda Torres',product:'Barra Proteína Cx12',qty:4,price:154.80,date:'2026-07-02',status:'separando'},
  {id:9,client:'Fernanda Torres',product:'Energético Cx24',qty:1,price:357.60,date:'2026-07-05',status:'retirado'},
  {id:10,client:'João Victor',product:'Whey Protein 900g',qty:8,price:149.90,date:'2026-07-03',status:'retirado'},
  {id:11,client:'João Victor',product:'Creatina 300g',qty:2,price:89.90,date:'2026-07-06',status:'pendente'},
  {id:12,client:'Mariana Costa',product:'Multivitamínico',qty:3,price:54.90,date:'2026-07-03',status:'pendente'},
  {id:13,client:'Pedro Santos',product:'Energético Cx24',qty:2,price:357.60,date:'2026-07-04',status:'pendente'},
  {id:14,client:'Rafael Lima',product:'Creatina 300g',qty:6,price:89.90,date:'2026-07-04',status:'retirado'},
  {id:15,client:'Rafael Lima',product:'Hipercalórico 3kg',qty:2,price:119.90,date:'2026-07-06',status:'pendente'},
  {id:16,client:'Juliana Souza',product:'Pré-Treino Égide',qty:4,price:109.90,date:'2026-07-05',status:'separando'},
  {id:17,client:'Larissa Alves',product:'Barra Proteína Cx12',qty:5,price:154.80,date:'2026-07-06',status:'pendente'},
  {id:18,client:'Gabriel Nunes',product:'Ômega 3 120caps',qty:4,price:49.90,date:'2026-07-06',status:'retirado'}
];

var rankData = [
  {v:'Lucas Silva',val:5940,q:45},{v:'Marina Costa',val:4820,q:38},{v:'Pedro Santos',val:4150,q:32},
  {v:'Ana Oliveira',val:3890,q:29},{v:'Rafael Lima',val:2780,q:21},{v:'Juliana Souza',val:1980,q:15},
  {v:'Carlos Eduardo',val:1540,q:11},{v:'Fernanda Torres',val:980,q:7}
];

// Meta do vendedor - armazenada em localStorage
function getMeta() {
  try { var r = localStorage.getItem('md_meta_' + VENDOR_NAME); if (r) return parseFloat(r); } catch(e) {}
  return 15000;
}
function setMeta(v) { try { localStorage.setItem('md_meta_' + VENDOR_NAME, v); } catch(e) {} }

function formatMoney(v) { return NE.money(v); }
function formatDate(d) { return new Date(d + 'T00:00:00').toLocaleDateString('pt-BR'); }
function formatDay(d) { return d.slice(8, 10) + '/' + d.slice(5, 7); }
function ic(n, c) { return NE.ic(n, c); }
function statusLabel(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function statusBadge(s) { return '<span class="badge ' + (s === 'retirado' ? 'badge-ok' : s === 'separando' ? 'badge-w' : 'badge-c') + '">' + statusLabel(s) + '</span>'; }
function statCard(title, icon, val, sub, cls) {
  return '<div class="stat-card' + (cls ? ' ' + cls : '') + '"><h3>' + title + ic(icon, 'ic-sm') + '</h3><div class="val">' + val + '</div>' + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>';
}
function drawBar(id, labels, values, label, colors) {
  var c = document.getElementById(id); if (!c) return;
  if (typeof Chart === 'undefined') {
    var fallback = document.createElement('p');
    fallback.className = 'chart-unavailable';
    fallback.textContent = 'Não foi possível carregar o gráfico.';
    c.replaceWith(fallback);
    return;
  }
  c.setAttribute('role', 'img');
  c.setAttribute('aria-label', label + '. ' + labels.map(function(value, index) { return value + ': ' + values[index]; }).join('; '));
  var prev = Chart.getChart(c); if (prev) prev.destroy();
  Chart.defaults.font.family = "'Inter',sans-serif";
  Chart.defaults.color = '#62605A';
  new Chart(c, {type:'bar',data:{labels:labels,datasets:[{label:label,data:values,backgroundColor:colors || getComputedStyle(document.documentElement).getPropertyValue('--brand-primary').trim(),hoverBackgroundColor:'#141414',borderRadius:6,maxBarThickness:44}]},options:{responsive:true,maintainAspectRatio:false,animation:matchMedia('(prefers-reduced-motion: reduce)').matches ? false : {duration:250},plugins:{legend:{display:false}},scales:{x:{grid:{display:false},border:{display:false}},y:{beginAtZero:true,grid:{color:'#EFEDE8'},border:{display:false}}}}});
}

function toggleSidebar(force) {
  var s = document.getElementById('sidebar'), o = document.getElementById('overlay');
  var button = document.getElementById('vendorMenuButton');
  var open = force !== true && !s.classList.contains('open');
  s.classList.toggle('open', open);
  o.style.display = open ? 'block' : 'none';
  button.setAttribute('aria-expanded', String(open));
  button.setAttribute('aria-label', open ? 'Fechar menu' : 'Abrir menu');
  if (open) s.querySelector('.sidebar-link.on')?.focus();
  if (!open && s.contains(document.activeElement) && button.offsetWidth) button.focus();
}

function getClients() {
  var names = [];
  allOrders.forEach(function(o) { if (names.indexOf(o.client) < 0) names.push(o.client); });
  return names;
}

function getClientOrders(clientName) {
  return allOrders.filter(function(o) { return o.client === clientName; });
}

// ============= NAVIGATION =============
var currentTag = 'dash', pedClient = null;
function openTag(tag) {
  currentTag = tag;
  var links = document.querySelectorAll('.stag-link');
  for (var i = 0; i < links.length; i++) { links[i].classList.remove('on'); }
  var al = document.querySelector('[data-tag="' + tag + '"]');
  if (al) al.classList.add('on');
  var titles = {dash:'Visão geral',pedidos:'Pedidos por cliente',clientes:'Meus clientes',link:'Meu link',metas:'Minhas metas',rank:'Ranking'};
  document.getElementById('breadcrumb').textContent = titles[tag] || tag;
  var r = document.getElementById('pageRoot'); r.innerHTML = '';
  var fns = {dash:rDash,pedidos:rPed,clientes:rCli,link:rLink,metas:rMeta,rank:rRank};
  (fns[tag] || rDash)(r);
  toggleSidebar(true);
}

// ============= DASHBOARD =============
function rDash(ct) {
  var todayV = allOrders.filter(function(o) { return o.date >= '2026-07-06'; }).reduce(function(s,o) { return s + (o.price * o.qty); }, 0);
  var weekV = allOrders.reduce(function(s,o) { return s + (o.price * o.qty); }, 0);
  var tp = allOrders.reduce(function(s,o) { return s + o.qty; }, 0);
  var pend = allOrders.filter(function(o) { return o.status === 'pendente'; }).length;
  var clist = getClients();
  ct.innerHTML =
    '<div class="stats">' +
      statCard('Vendas na semana', 'money', formatMoney(weekV), 'Hoje: ' + formatMoney(todayV), 'lead') +
      statCard('Pedidos pendentes', 'list', pend, '', pend ? 'is-w' : '') +
      statCard('Produtos vendidos', 'box', tp + ' un') +
      statCard('Clientes', 'users', clist.length) +
      statCard('Ticket médio', 'chart', formatMoney(weekV / allOrders.length)) +
    '</div>' +
    '<div class="chart-row">' +
      '<div class="chart-card"><div class="card-hd"><h3>Vendas por dia</h3></div><div class="chart-box"><canvas id="chDash"></canvas></div></div>' +
      '<div class="chart-card"><div class="card-hd"><h3>Últimos pedidos</h3><button class="btn btn-gh btn-sm" onclick="openTag(\'pedidos\')">Ver todos</button></div><ul class="row-list">' +
        allOrders.slice(-6).reverse().map(function(o) {
          return '<li class="row-it"><span class="grow">' + o.product + ' × ' + o.qty + '<br><span class="meta">' + o.client + '</span></span><span class="num" style="font-weight:600">' + formatMoney(o.price * o.qty) + '</span>' + statusBadge(o.status) + '</li>';
        }).join('') +
      '</ul></div>' +
    '</div>';
  setTimeout(function() {
    var days = {}; allOrders.forEach(function(o) { days[o.date] = (days[o.date] || 0) + (o.price * o.qty); });
    var dk = Object.keys(days).sort();
    drawBar('chDash', dk.map(formatDay), dk.map(function(d) { return days[d]; }), 'R$');
  }, 60);
}

// ============= PEDIDOS POR CLIENTE =============
function rPed(ct) {
  var clients = getClients();
  pedClient = null;
  ct.innerHTML =
    '<div class="chips mb" id="pedTabs">' +
      '<button class="chip on" onclick="showAllOrders(this)">Todos os pedidos</button>' +
      clients.map(function(cl) { return '<button class="chip" onclick="showClientOrders(&quot;' + cl + '&quot;, this)">' + cl + '</button>'; }).join('') +
    '</div>' +
    '<div id="pedContent">' + buildAllOrdersTable(allOrders) + '</div>';
}

function buildAllOrdersTable(orders) {
  if (!orders.length) return '<div class="table-card"><div class="empty-state"><div class="ic-wrap">' + ic('list') + '</div><h4>Nenhum pedido</h4><p>Os pedidos aparecem aqui assim que forem feitos.</p></div></div>';
  return '<div class="table-card"><div class="table-wrap"><table class="resp"><thead><tr><th>Data</th><th>Cliente</th><th>Produto</th><th class="r">Qtd</th><th class="r">Valor</th><th>Status</th><th></th></tr></thead><tbody>' +
    orders.slice().reverse().map(function(o) {
      var act = o.status === 'pendente'
        ? '<div class="row-act"><button class="btn btn-g btn-sm" onclick="approveOrder(' + o.id + ')">Aprovar</button><button class="btn btn-gh btn-sm" onclick="openDiscount(' + o.id + ')">Desconto</button></div>'
        : '';
      return '<tr><td data-l="Data">' + formatDate(o.date) + '</td><td class="strong" data-l="Cliente">' + o.client + '</td><td data-l="Produto">' + o.product + '</td><td class="r" data-l="Qtd">' + o.qty + '</td><td class="r strong" data-l="Valor">' + formatMoney(o.price * o.qty) + '</td><td data-l="Status">' + statusBadge(o.status) + '</td><td class="act" data-l="Ações">' + act + '</td></tr>';
    }).join('') +
  '</tbody></table></div></div>';
}

function refreshOrders() {
  var d = document.querySelector('[data-detail]');
  if (d) { openClientDetail(d.getAttribute('data-detail')); return; }
  if (currentTag !== 'pedidos') { openTag(currentTag); return; }
  if (pedClient) {
    var active = document.querySelector('#pedTabs .chip.on');
    showClientOrders(pedClient, active);
  } else {
    document.getElementById('pedContent').innerHTML = buildAllOrdersTable(allOrders);
  }
}

function approveOrder(id) {
  var o = allOrders.find(function(x) { return x.id === id; }); if (!o) return;
  o.status = 'separando';
  refreshOrders();
  NE.toast('Pedido aprovado. Status: Separando');
}

function openDiscount(id) {
  var o = allOrders.find(function(x) { return x.id === id; }); if (!o) return;
  document.getElementById('modalBody').innerHTML =
    '<div class="modal-hd"><h3>Aplicar desconto</h3><button class="btn btn-gh btn-ic" aria-label="Fechar" onclick="closeModal()">' + ic('x') + '</button></div>' +
    '<div class="modal-bd"><p style="font-size:var(--fs-sm);color:var(--muted);margin-bottom:var(--s3)">' + o.product + ' × ' + o.qty + ' · ' + o.client + '<br>Valor atual: <strong style="color:var(--ink)">' + formatMoney(o.price * o.qty) + '</strong></p>' +
    '<div class="fg"><label for="discPct">Desconto (%)</label><input type="number" class="fi" id="discPct" min="1" max="100" step="1" oninput="previewDiscount(' + id + ')"><span class="fhint" id="discPrev">Informe o percentual.</span></div></div>' +
    '<div class="modal-ft"><button class="btn btn-o" onclick="closeModal()">Cancelar</button><button class="btn btn-p" onclick="applyDiscount(' + id + ')">Aplicar</button></div>';
  document.getElementById('modalOverlay').classList.add('on');
  document.getElementById('discPct').focus();
}
function previewDiscount(id) {
  var o = allOrders.find(function(x) { return x.id === id; });
  var p = parseFloat(document.getElementById('discPct').value);
  document.getElementById('discPrev').textContent = p > 0 && p <= 100 ? 'Novo valor: ' + formatMoney(o.price * o.qty * (1 - p / 100)) : 'Informe de 1 a 100%.';
}
function applyDiscount(id) {
  var o = allOrders.find(function(x) { return x.id === id; });
  var p = parseFloat(document.getElementById('discPct').value);
  if (!(p > 0 && p <= 100)) { NE.toast('Informe um percentual de 1 a 100', 'err'); return; }
  o.price = o.price * (1 - p / 100);
  closeModal();
  refreshOrders();
  NE.toast('Desconto de ' + p + '% aplicado');
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('on');
  document.getElementById('modalBody').innerHTML = '';
}
document.getElementById('modalOverlay').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') { closeModal(); toggleSidebar(true); } });

function setPedChip(btn) {
  document.querySelectorAll('#pedTabs .chip').forEach(function(b) { b.classList.remove('on'); });
  if (btn) btn.classList.add('on');
}

function showAllOrders(btn) {
  setPedChip(btn);
  pedClient = null;
  document.getElementById('pedContent').innerHTML = buildAllOrdersTable(allOrders);
}

function showClientOrders(clientName, btn) {
  setPedChip(btn);
  pedClient = clientName;
  var cos = getClientOrders(clientName);
  var totalQ = cos.reduce(function(s,o) { return s + o.qty; }, 0);
  var totalV = cos.reduce(function(s,o) { return s + (o.price * o.qty); }, 0);
  // Find most ordered product
  var prodCounts = {};
  cos.forEach(function(o) { prodCounts[o.product] = (prodCounts[o.product] || 0) + o.qty; });
  var topProd = Object.entries(prodCounts).sort(function(a,b) { return b[1] - a[1]; })[0];
  document.getElementById('pedContent').innerHTML =
    '<div class="stats">' +
      statCard('Total comprado', 'money', formatMoney(totalV), '', 'lead') +
      statCard('Unidades', 'box', totalQ + ' un') +
      statCard('Compras', 'list', cos.length, 'pedidos') +
      statCard('Mais pedido', 'star', '<span style="font-size:var(--fs-md)">' + (topProd ? topProd[0] : '—') + '</span>', topProd ? topProd[1] + ' un' : '') +
    '</div>' +
    '<div class="chart-row"><div class="chart-card"><div class="card-hd"><h3>Histórico de compras de ' + clientName + '</h3></div><div class="chart-box sm"><canvas id="chCl"></canvas></div></div></div>' +
    buildAllOrdersTable(cos);
  setTimeout(function() {
    var days = {}; cos.forEach(function(o) { days[o.date] = (days[o.date] || 0) + (o.price * o.qty); });
    var dk = Object.keys(days).sort();
    drawBar('chCl', dk.map(formatDay), dk.map(function(d) { return days[d]; }), 'R$');
  }, 60);
}

// ============= MEUS CLIENTES =============
function rCli(ct) {
  var clients = getClients();
  ct.innerHTML = '<h2 class="sec-t">' + clients.length + ' clientes</h2>' +
    clients.map(function(cl) {
      var cos = getClientOrders(cl);
      var total = cos.reduce(function(s,o) { return s + (o.price * o.qty); }, 0);
      var prods = {}; cos.forEach(function(o) { prods[o.product] = (prods[o.product] || 0) + o.qty; });
      var topP = Object.entries(prods).sort(function(a,b) { return b[1] - a[1]; })[0];
      return '<button class="client-card" onclick="openClientDetail(&quot;' + cl + '&quot;)"><span class="cl-main"><span class="thumb">' + cl.split(' ').map(function(w) { return w[0]; }).slice(0, 2).join('') + '</span><span><span class="cl-name">' + cl + '</span><span class="cl-note" style="display:block">Mais pedido: ' + (topP ? topP[0] : '—') + ' · ' + (new Set(cos.map(function(o) { return o.date; }))).size + ' dias com compra</span></span></span><span class="cl-stats"><strong>' + formatMoney(total) + '</strong>' + cos.length + ' pedidos</span></button>';
    }).join('');
}
function openClientDetail(clientName) {
  var cos = getClientOrders(clientName);
  var total = cos.reduce(function(s,o) { return s + (o.price * o.qty); }, 0);
  var prods = {}; cos.forEach(function(o) { prods[o.product] = (prods[o.product] || 0) + o.qty; });
  var topP = Object.entries(prods).sort(function(a,b) { return b[1] - a[1]; })[0];
  var ct = document.getElementById('pageRoot');
  ct.innerHTML =
    '<div data-detail="' + clientName + '">' +
      '<div class="detail-hd"><button class="btn btn-gh btn-ic" aria-label="Voltar para clientes" onclick="openTag(&quot;clientes&quot;)">' + ic('left') + '</button><h2>' + clientName + '</h2></div>' +
      '<div class="stats">' +
        statCard('Total comprado', 'money', formatMoney(total), '', 'lead') +
        statCard('Pedidos', 'box', cos.length) +
        statCard('Dias com compra', 'clock', (new Set(cos.map(function(o) { return o.date; }))).size) +
        statCard('Produto favorito', 'star', '<span style="font-size:var(--fs-md)">' + (topP ? topP[0] : '—') + '</span>', topP ? topP[1] + ' un' : '') +
      '</div>' +
      '<div class="chart-card mb"><div class="card-hd"><h3>Produtos mais pedidos</h3></div><div class="chart-box"><canvas id="chPrd"></canvas></div></div>' +
      '<h3 class="sec-t">Histórico completo</h3>' +
      buildAllOrdersTable(cos) +
    '</div>';
  setTimeout(function() {
    var prods = {}; cos.forEach(function(o) { prods[o.product] = (prods[o.product] || 0) + o.qty; });
    var sorted = Object.entries(prods).sort(function(a,b) { return b[1] - a[1]; });
    drawBar('chPrd', sorted.map(function(d) { return d[0]; }), sorted.map(function(d) { return d[1]; }), 'Un', [getComputedStyle(document.documentElement).getPropertyValue('--brand-primary').trim(),'#141414','#3a3a3a','#62605A','#8A877F']);
  }, 60);
}

// ============= MEU LINK =============
function copyLink() {
  var done = function() { NE.toast('Link copiado'); };
  if (navigator.clipboard) { navigator.clipboard.writeText('maxdistrib.com.br/lucas').then(done, function() { NE.toast('Não foi possível copiar o link', 'err'); }); }
  else { NE.toast('Não foi possível copiar o link', 'err'); }
}
function rLink(ct) {
  var total = allOrders.reduce(function(s,o) { return s + (o.price * o.qty); }, 0);
  ct.innerHTML =
    '<div class="chart-card mb"><div class="card-hd"><h3>Meu link de vendedor</h3></div><p class="link-note">Compartilhe este link. Todo pedido feito por ele fica vinculado a você.</p><div class="link-box"><span>maxdistrib.com.br/<strong>lucas</strong></span><button class="btn btn-g btn-sm" onclick="copyLink()">' + ic('copy', 'ic-sm') + 'Copiar</button></div><div class="link-acts"><button class="btn btn-o btn-sm" onclick="window.open(&quot;https://wa.me/?text=Veja%20os%20melhores%20suplementos:%20maxdistrib.com.br/lucas&quot;)">' + ic('wa', 'ic-sm') + 'Enviar no WhatsApp</button></div></div>' +
    '<div class="stats">' + statCard('Clientes pelo link', 'users', getClients().length) + statCard('Vendas pelo link', 'money', formatMoney(total)) + '</div>';
}

// ============= METAS (EDITÁVEL) =============
function rMeta(ct) {
  var metaVal = getMeta();
  var atingido = allOrders.reduce(function(s,o) { return s + (o.price * o.qty); }, 0);
  var pct = Math.round((atingido / metaVal) * 100);
  ct.innerHTML =
    '<div class="chart-card mb"><div class="card-hd"><h3>Minha meta · Julho de 2026</h3><span class="badge badge-g num" id="metaPct">' + pct + '%</span></div>' +
      '<div class="meta-bar"><div class="meta-fill" style="width:' + Math.min(pct, 100) + '%"></div></div>' +
      '<div class="meta-info mb"><span><strong class="num">' + formatMoney(atingido) + '</strong> atingidos</span><span>Meta: <strong class="num" id="metaLabel">' + formatMoney(metaVal) + '</strong></span></div>' +
      '<div class="fg"><label for="metaInput">Ajustar meta mensal (R$)</label><div class="meta-ctl"><input type="range" id="metaRange" aria-label="Meta mensal" min="5000" max="50000" step="500" value="' + metaVal + '" oninput="updateMetaDisplay()"><input type="number" class="fi" id="metaInput" value="' + metaVal + '" onchange="updateMetaFromInput()"></div></div>' +
      '<p style="font-size:var(--fs-sm);color:var(--muted)" id="metaLeft">Faltam <strong style="color:var(--ink)">' + formatMoney(Math.max(0, metaVal - atingido)) + '</strong> para bater a meta.</p>' +
    '</div>' +
    '<div class="stats">' +
      statCard('Meta semanal', 'clock', '<span id="metaWeek">' + formatMoney(metaVal / 4) + '</span>', formatMoney(atingido) + ' atingidos') +
      statCard('Meta de creatina', 'trophy', '30 un', '18 vendidas · 60%') +
      statCard('Comissão estimada', 'money', formatMoney(atingido * 0.1), '10% sobre vendas') +
    '</div>';
}
function paintMeta(v) {
  var atingido = allOrders.reduce(function(s,o) { return s + (o.price * o.qty); }, 0);
  var pct = Math.round((atingido / v) * 100);
  document.getElementById('metaLabel').textContent = formatMoney(v);
  document.getElementById('metaPct').textContent = pct + '%';
  document.querySelector('.meta-fill').style.width = Math.min(pct, 100) + '%';
  document.getElementById('metaWeek').textContent = formatMoney(v / 4);
  document.getElementById('metaLeft').innerHTML = 'Faltam <strong style="color:var(--ink)">' + formatMoney(Math.max(0, v - atingido)) + '</strong> para bater a meta.';
  setMeta(v);
}
function updateMetaDisplay() {
  var v = parseInt(document.getElementById('metaRange').value);
  document.getElementById('metaInput').value = v;
  paintMeta(v);
}
function updateMetaFromInput() {
  var v = parseInt(document.getElementById('metaInput').value) || 5000;
  document.getElementById('metaRange').value = v;
  paintMeta(v);
}

// ============= RANKING =============
function rRank(ct) {
  var myIdx = rankData.findIndex(function(r) { return r.v === VENDOR_NAME; });
  ct.innerHTML =
    '<div class="table-card"><div class="table-head"><h2>Ranking de vendedores</h2><span class="badge badge-n">Julho de 2026</span></div><div class="table-wrap"><table class="resp"><thead><tr><th>#</th><th>Vendedor</th><th class="r">Vendas</th><th class="r">Produtos</th></tr></thead><tbody>' +
      rankData.map(function(r,i) {
        var me = r.v === VENDOR_NAME;
        return '<tr' + (me ? ' class="me"' : '') + '><td data-l="Posição"><span class="rank-pos' + (i < 3 ? ' top' : '') + '">' + (i + 1) + 'º</span></td><td class="strong" data-l="Vendedor">' + r.v + (me ? ' <span class="badge badge-g">Você</span>' : '') + '</td><td class="r strong" data-l="Vendas">' + formatMoney(r.val) + '</td><td class="r" data-l="Produtos">' + r.q + ' un</td></tr>';
      }).join('') +
    '</tbody></table></div></div>' +
    '<p class="rank-foot">Sua posição: <strong>' + (myIdx + 1) + 'º de ' + rankData.length + '</strong> · ' + formatMoney(rankData[myIdx].val) + ' em vendas</p>';
}

// ============= INIT =============
openTag('dash');
</script>
</body>
