function loadData() {
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (raw) { return JSON.parse(raw); }
  } catch(e) { console.log('Erro ao carregar dados, usando padrão'); }
  return getDefaultData();
}

function saveData(data) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch(e) {}
}

// ============= INIT =============
var DATA = loadData();
if (!localStorage.getItem(STORE_KEY)) { saveData(DATA); }
var currentTab = 'dash';
var aiPendingAction = null;

// ============= HELPERS =============
var ic = NE.ic, esc = NE.esc, formatMoney = NE.money, showToast = NE.toast;
var charts = [], prodFilter = {q: '', cat: '', st: '', page: 1}, PAGE = 10, repDays = 0;
var REASONS = {venda: 'Venda', perda: 'Perda', uso: 'Uso interno', ajuste: 'Ajuste'};
function today() { return new Date().toISOString().split('T')[0]; }
function formatDate(d) { return d ? new Date(d + 'T00:00:00').toLocaleDateString('pt-BR') : '—'; }
function shortDate(d) { return new Date(d + 'T00:00:00').toLocaleDateString('pt-BR', {day: '2-digit', month: '2-digit'}); }
function getProduct(id) { return DATA.products.find(function(p) { return p.id === id; }); }
function getProductName(id) { var p = getProduct(id); return p ? p.name : '—'; }
function statusOf(p) { return p.qty === 0 ? ['badge-c', 'Zerado'] : p.qty <= p.min ? ['badge-w', 'Baixo'] : ['badge-ok', 'OK']; }
function expSoon(p) { if (!p.expiry) return false; var d = new Date(p.expiry + 'T00:00:00'), n = new Date(); n.setMonth(n.getMonth() + 2); return d <= n; }
function emptyBox(icon, title, text) { return '<div class="empty-state"><div class="ic-wrap">' + ic(icon) + '</div><h4>' + title + '</h4><p>' + (text || '') + '</p></div>'; }
function statCard(o) { return '<button class="stat-card link' + (o.cls ? ' ' + o.cls : '') + '" onclick="openTab(\'' + o.tab + '\')"><h3>' + o.t + ic(o.i, 'ic-sm') + '</h3><div class="val">' + o.v + '</div>' + (o.s ? '<div class="sub">' + o.s + '</div>' : '') + '</button>'; }
var modalTrigger = null;
function modalHead(t) { return '<div class="modal-hd"><h3 id="dialogTitle">' + t + '</h3><button class="btn btn-gh btn-ic" onclick="closeModal()" aria-label="Fechar">' + ic('x') + '</button></div>'; }
function openModal(html) {
  var modalBody = document.getElementById('modalBody');
  modalTrigger = document.activeElement;
  modalBody.innerHTML = html;
  document.getElementById('modalOverlay').classList.add('on');
  document.getElementById('mainContent').inert = true;
  document.getElementById('sidebar').inert = true;
  modalBody.querySelector('.modal-hd button').focus();
}

function toggleSidebar(force) {
  var s = document.getElementById('sidebar');
  var o = document.getElementById('overlay');
  var button = document.getElementById('menuButton');
  var wasOpen = s.classList.contains('open');
  var open = force !== true && !wasOpen;
  s.classList.toggle('open', open);
  o.style.display = open ? 'block' : 'none';
  button.setAttribute('aria-expanded', String(open));
  button.setAttribute('aria-label', open ? 'Fechar menu' : 'Abrir menu');
  if (open) s.querySelector('.sidebar-link.on').focus();
  if (wasOpen && !open) button.focus();
}
matchMedia('(max-width:900px)').addEventListener('change', function() { toggleSidebar(true); });

function drawChart(id, cfg) {
  if (typeof Chart === 'undefined') {
    var box = document.getElementById(id); if (box) box.parentElement.innerHTML = emptyBox('chart', 'Gráfico indisponível', 'Verifique a conexão e abra a tela novamente.');
    return;
  }
  setTimeout(function() {
    var c = document.getElementById(id); if (!c) return;
    Chart.defaults.font.family = "'Inter',sans-serif"; Chart.defaults.color = '#62605A';
    if (matchMedia('(prefers-reduced-motion:reduce)').matches) Chart.defaults.animation = false;
    var sk = c.parentElement.querySelector('.skeleton'); if (sk) sk.remove();
    if (Chart.getChart(c)) return;
    charts.push(new Chart(c, cfg));
  }, 60);
}
function chartBox(id) { return '<div class="chart-box"><div class="skeleton"></div><canvas id="' + id + '"></canvas></div>'; }

// ============= TAB NAVIGATION =============
var NAV = [
  ['Principal', [['dash', 'dash', 'Dashboard']]],
  ['Gestão', [['prod', 'box', 'Produtos'], ['entrada', 'in', 'Entrada'], ['saida', 'out', 'Saída'], ['pedidos', 'list', 'Pedidos por vendedor'], ['promo', 'tag', 'Promoções']]],
  ['Inteligência', [['alertas', 'bell', 'Alertas'], ['ia', 'chat', 'Assistente IA'], ['rel', 'chart', 'Relatórios']]],
  ['Controle', [['fifo', 'clock', 'FIFO e validade'], ['cfg', 'cog', 'Configurações']]]
];
function renderNav() {
  var n = buildAlerts().length;
  document.getElementById('sideNav').innerHTML = NAV.map(function(g) {
    return '<div class="sidebar-sec">' + g[0] + '</div>' + g[1].map(function(l) {
      return '<button class="sidebar-link tab-link' + (l[0] === currentTab ? ' on' : '') + '" data-tab="' + l[0] + '" onclick="openTab(\'' + l[0] + '\')"' + (l[0] === currentTab ? ' aria-current="page"' : '') + '>' + ic(l[1]) + l[2] + (l[0] === 'alertas' && n ? '<span class="count">' + n + '</span>' : '') + '</button>';
    }).join('');
  }).join('');
}
function openTab(tab) {
  currentTab = tab;
  DATA = loadData();
  renderNav();
  var titles = {dash:'Dashboard',prod:'Produtos',entrada:'Entrada de estoque',saida:'Saída de estoque',pedidos:'Pedidos por vendedor',promo:'Promoções',alertas:'Alertas',ia:'Assistente IA',rel:'Relatórios',fifo:'FIFO e validade',cfg:'Configurações'};
  document.getElementById('breadcrumb').textContent = titles[tab] || tab;
  document.title = (titles[tab] || tab) + ' · Estoque Inteligente';
  renderTab(tab);
  toggleSidebar(true);
  window.scrollTo(0, 0);
}

function renderTab(tab) {
  var container = document.getElementById('pageContent');
  charts.forEach(function(c) { c.destroy(); }); charts = [];
  container.innerHTML = '';
  container.style.animation = 'none'; void container.offsetWidth; container.style.animation = '';
  switch(tab) {
    case 'dash': renderDashboard(container); break;
    case 'prod': renderProducts(container); break;
    case 'entrada': renderStockIn(container); break;
    case 'saida': renderStockOut(container); break;
    case 'pedidos': renderVendorOrders(container); break;
    case 'promo': renderPromos(container); break;
    case 'alertas': renderAlerts(container); break;
    case 'ia': renderAI(container); break;
    case 'rel': renderReports(container); break;
    case 'fifo': renderFIFO(container); break;
    case 'cfg': renderConfig(container); break;
    default: renderDashboard(container);
  }
}

// ============= DASHBOARD =============
function renderDashboard(container) {
  var tp = DATA.products.length;
  var lo = DATA.products.filter(function(p) { return p.qty > 0 && p.qty <= p.min; }).length;
  var ze = DATA.products.filter(function(p) { return p.qty === 0; }).length;
  var tv = DATA.products.reduce(function(s, p) { return s + (p.qty * p.cost); }, 0);
  var po = DATA.orders.filter(function(o) { return o.status === 'pendente'; }).length;
  var es = DATA.products.filter(expSoon).length;
  var low = DATA.products.filter(function(p) { return p.qty <= p.min; }).sort(function(a, b) { return a.qty - b.qty; }).slice(0, 6);

  container.innerHTML =
    '<div class="stats kpi">' +
      statCard({t: 'Valor do estoque', i: 'money', v: formatMoney(tv), s: 'pelo preço de custo', tab: 'rel', cls: 'lead'}) +
      statCard({t: 'Produtos', i: 'box', v: tp, tab: 'prod'}) +
      statCard({t: 'Estoque baixo', i: 'alert', v: lo, tab: 'alertas', cls: lo ? 'is-w' : ''}) +
      statCard({t: 'Zerados', i: 'ban', v: ze, tab: 'alertas', cls: ze ? 'is-c' : ''}) +
      statCard({t: 'Pedidos pendentes', i: 'list', v: po, tab: 'pedidos'}) +
      statCard({t: 'Vencem em 2 meses', i: 'clock', v: es, s: 'prioridade FIFO', tab: 'fifo', cls: es ? 'is-w' : ''}) +
    '</div>' +
    '<div class="chart-row"><div class="chart-card"><div class="card-hd"><h3>Movimentações por dia</h3><span class="badge badge-n">Últimos 10 dias com registro</span></div>' + chartBox('chMov') + '</div></div>' +
    '<div class="chart-row">' +
      '<div class="chart-card"><div class="card-hd"><h3>Precisam de reposição</h3><button class="btn btn-gh btn-sm" onclick="openTab(\'alertas\')">Ver alertas</button></div>' +
        (low.length ? '<ul class="row-list">' + low.map(function(p) {
          return '<li class="row-it"><span class="grow">' + esc(p.name) + '</span><span class="badge ' + statusOf(p)[0] + ' num">' + p.qty + ' / ' + p.min + '</span></li>';
        }).join('') + '</ul>' : emptyBox('check', 'Estoque em dia', 'Nenhum produto abaixo do mínimo.')) +
      '</div>' +
      '<div class="chart-card"><div class="card-hd"><h3>Últimas movimentações</h3></div>' +
        (DATA.movements.length ? '<ul class="row-list">' + DATA.movements.slice(-6).reverse().map(function(m) {
          var i = m.type === 'in';
          return '<li class="row-it"><span class="dir ' + m.type + '">' + ic(i ? 'in' : 'out', 'ic-sm') + '</span><span class="grow">' + esc(getProductName(m.pid)) + '</span><span class="num ' + (i ? 'qty-in' : 'qty-out') + '">' + (i ? '+' : '−') + m.qty + '</span><span class="meta num">' + shortDate(m.date) + '</span></li>';
        }).join('') + '</ul>' : emptyBox('list', 'Sem movimentações', 'Registre uma entrada para começar.')) +
      '</div>' +
    '</div>';

  var days = {};
  DATA.movements.forEach(function(m) { days[m.date] = days[m.date] || {in: 0, out: 0}; days[m.date][m.type] += m.qty; });
  var keys = Object.keys(days).sort().slice(-10);
  drawChart('chMov', {type: 'bar', data: {labels: keys.map(shortDate), datasets: [
    {label: 'Entradas', data: keys.map(function(k) { return days[k].in; }), backgroundColor: '#F4C430', borderRadius: 4, maxBarThickness: 28},
    {label: 'Saídas', data: keys.map(function(k) { return days[k].out; }), backgroundColor: '#141414', borderRadius: 4, maxBarThickness: 28}
  ]}, options: {responsive: true, maintainAspectRatio: false, plugins: {legend: {position: 'top', align: 'end', labels: {boxWidth: 10, boxHeight: 10, useBorderRadius: true, borderRadius: 2}}}, scales: {x: {grid: {display: false}}, y: {beginAtZero: true, border: {display: false}, grid: {color: '#EFEDE8'}, ticks: {precision: 0}}}}});
}

// ============= PRODUCTS =============
function renderProducts(container) {
  var cats = DATA.products.map(function(p) { return p.cat; }).filter(function(c, i, a) { return c && a.indexOf(c) === i; }).sort();
  container.innerHTML =
    '<div class="table-card"><div class="table-head"><div class="table-head-act" style="flex:1"><div class="input-ic" style="width:240px">' + ic('search', 'ic-sm') + '<input class="fi" id="prodSearch" placeholder="Nome, marca, categoria ou SKU" aria-label="Buscar produtos" value="' + esc(prodFilter.q) + '" oninput="prodFilter.q=this.value;filterProducts()"></div>' +
    '<select class="fi fs" style="width:170px" aria-label="Filtrar por categoria" onchange="prodFilter.cat=this.value;filterProducts()"><option value="">Categoria</option>' + cats.map(function(c) { return '<option' + (c === prodFilter.cat ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select>' +
    '<select class="fi fs" style="width:140px" aria-label="Filtrar por situação" onchange="prodFilter.st=this.value;filterProducts()"><option value="">Situação</option>' + ['OK', 'Baixo', 'Zerado'].map(function(s) { return '<option' + (s === prodFilter.st ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select></div>' +
    '<button class="btn btn-p btn-sm" onclick="openProductModal()">' + ic('plus', 'ic-sm') + 'Novo produto</button></div>' +
    '<div id="prodTable"></div></div>';

}

function buildProductRows(arr) {
  return arr.map(function(p) {
    var st = statusOf(p), pct = Math.min(100, (p.qty / Math.max(p.min * 2, 1)) * 100);
    return '<tr><td class="lead"><div class="prod-cell"><span class="thumb">' + esc(p.name.slice(0, 2).toUpperCase()) + '</span><div><strong>' + esc(p.name) + '</strong><small>' + esc(p.sku) + '</small></div></div></td>' +
      '<td data-l="Categoria">' + esc(p.cat) + '</td><td data-l="Marca">' + esc(p.brand) + '</td>' +
      '<td data-l="Estoque"><div class="stock-cell"><div class="n"><b class="num">' + p.qty + ' un</b><span class="num">mín. ' + p.min + '</span></div><div class="bar"><i class="' + (p.qty === 0 ? 'c' : p.qty <= p.min ? 'w' : '') + '" style="width:' + pct + '%"></i></div></div></td>' +
      '<td data-l="Lote" class="code">' + esc(p.lot || '—') + '</td><td data-l="Validade" class="num">' + formatDate(p.expiry) + '</td>' +
      '<td data-l="Situação"><span class="badge ' + st[0] + '">' + st[1] + '</span></td><td data-l="Preço" class="r strong">' + formatMoney(p.price) + '</td>' +
      '<td class="act"><div class="row-act">' +
        '<button class="btn btn-gh btn-ic" title="Registrar entrada" aria-label="Registrar entrada de ' + esc(p.name) + '" onclick="openMovementModal(' + p.id + ',\'in\')">' + ic('in', 'ic-sm') + '</button>' +
        '<button class="btn btn-gh btn-ic" title="Registrar saída" aria-label="Registrar saída de ' + esc(p.name) + '" onclick="openMovementModal(' + p.id + ',\'out\')">' + ic('out', 'ic-sm') + '</button>' +
        '<button class="btn btn-gh btn-ic" title="Editar" aria-label="Editar ' + esc(p.name) + '" onclick="openProductModal(' + p.id + ')">' + ic('edit', 'ic-sm') + '</button>' +
        '<button class="btn btn-gh btn-ic is-danger" title="Excluir" aria-label="Excluir ' + esc(p.name) + '" onclick="deleteProduct(' + p.id + ')">' + ic('trash', 'ic-sm') + '</button>' +
      '</div></td></tr>';
  }).join('');
}

function filterProducts(keepPage) {
  if (!keepPage) prodFilter.page = 1;
  var q = prodFilter.q.toLowerCase();
  var filtered = DATA.products.filter(function(p) {
    return (p.name.toLowerCase().indexOf(q) >= 0 || p.cat.toLowerCase().indexOf(q) >= 0 || p.brand.toLowerCase().indexOf(q) >= 0 || p.sku.toLowerCase().indexOf(q) >= 0) &&
      (!prodFilter.cat || p.cat === prodFilter.cat) && (!prodFilter.st || statusOf(p)[1] === prodFilter.st);
  });
  var el = document.getElementById('prodTable');
  if (!filtered.length) { el.innerHTML = emptyBox('search', 'Nenhum produto encontrado', 'Ajuste a busca ou os filtros.'); return; }
  var pages = Math.ceil(filtered.length / PAGE); prodFilter.page = Math.min(prodFilter.page, pages);
  var from = (prodFilter.page - 1) * PAGE, slice = filtered.slice(from, from + PAGE);
  el.innerHTML = '<div class="table-wrap"><table class="resp"><thead><tr><th>Produto</th><th>Categoria</th><th>Marca</th><th>Estoque</th><th>Lote</th><th>Validade</th><th>Situação</th><th class="r">Preço</th><th><span class="sr">Ações</span></th></tr></thead><tbody>' + buildProductRows(slice) + '</tbody></table></div>' +
    '<div class="pager"><span class="num">' + (from + 1) + '–' + (from + slice.length) + ' de ' + filtered.length + '</span><div><button class="btn btn-o btn-sm" ' + (prodFilter.page <= 1 ? 'disabled' : '') + ' onclick="goPage(-1)">' + ic('left', 'ic-sm') + 'Anterior</button><button class="btn btn-o btn-sm" ' + (prodFilter.page >= pages ? 'disabled' : '') + ' onclick="goPage(1)">Próxima' + ic('right', 'ic-sm') + '</button></div></div>';
}
function goPage(d) { prodFilter.page += d; filterProducts(true); }

function openProductModal(id) {
  DATA = loadData();
  var p = id ? getProduct(id) : null;
  var ed = !!p;
  function v(k) { return ed && p[k] != null ? esc(p[k]) : ''; }
  openModal(modalHead(ed ? 'Editar produto' : 'Novo produto') +
    '<div class="modal-bd"><div class="fr">' +
      '<div class="fg full"><label for="pf_name">Nome do produto</label><input class="fi" id="pf_name" value="' + v('name') + '" placeholder="Ex.: Whey Protein 900g"></div>' +
      '<div class="fg"><label for="pf_cat">Categoria</label><input class="fi" id="pf_cat" value="' + v('cat') + '"></div>' +
      '<div class="fg"><label for="pf_brand">Marca</label><input class="fi" id="pf_brand" value="' + v('brand') + '"></div>' +
      '<div class="fg"><label for="pf_sku">SKU</label><input class="fi" id="pf_sku" value="' + v('sku') + '"></div>' +
      '<div class="fg"><label for="pf_cost">Preço de custo (R$)</label><input type="number" class="fi" id="pf_cost" value="' + v('cost') + '" step="0.01" min="0"></div>' +
      '<div class="fg"><label for="pf_price">Preço de venda (R$)</label><input type="number" class="fi" id="pf_price" value="' + v('price') + '" step="0.01" min="0"></div>' +
      '<div class="fg"><label for="pf_qty">' + (ed ? 'Quantidade atual' : 'Quantidade inicial') + '</label><input type="number" class="fi" id="pf_qty" value="' + (ed ? p.qty : '0') + '" ' + (ed ? 'readonly' : '') + '>' + (ed ? '<span class="fhint">Altere por entrada ou saída.</span>' : '') + '</div>' +
      '<div class="fg"><label for="pf_min">Estoque mínimo</label><input type="number" class="fi" id="pf_min" value="' + (ed ? p.min : '15') + '"></div>' +
      '<div class="fg"><label for="pf_supplier">Fornecedor</label><input class="fi" id="pf_supplier" value="' + v('supplier') + '"></div>' +
      '<div class="fg"><label for="pf_lot">Lote</label><input class="fi" id="pf_lot" value="' + v('lot') + '"></div>' +
      '<div class="fg"><label for="pf_expiry">Validade</label><input type="date" class="fi" id="pf_expiry" value="' + v('expiry') + '"></div>' +
      '<div class="fg full"><label for="pf_note">Observação</label><input class="fi" id="pf_note" value="' + v('note') + '"></div>' +
    '</div></div>' +
    '<div class="modal-ft"><button class="btn btn-o" onclick="closeModal()">Cancelar</button><button class="btn btn-p" onclick="saveProduct(' + (ed ? id : 'null') + ')">' + (ed ? 'Salvar alterações' : 'Cadastrar produto') + '</button></div>');
}

function saveProduct(id) {
  var data = {
    name: document.getElementById('pf_name').value.trim(),
    cat: document.getElementById('pf_cat').value.trim(),
    brand: document.getElementById('pf_brand').value.trim(),
    sku: document.getElementById('pf_sku').value.trim(),
    cost: parseFloat(document.getElementById('pf_cost').value) || 0,
    price: parseFloat(document.getElementById('pf_price').value) || 0,
    qty: parseInt(document.getElementById('pf_qty').value) || 0,
    min: parseInt(document.getElementById('pf_min').value) || 0,
    supplier: document.getElementById('pf_supplier').value.trim(),
    lot: document.getElementById('pf_lot').value.trim(),
    expiry: document.getElementById('pf_expiry').value,
    note: document.getElementById('pf_note').value.trim()
  };
  if (!data.name) { showToast('Informe o nome do produto', 'err'); return; }
  if (id) { Object.assign(getProduct(id), data); }
  else { DATA.products.push({id: DATA.nextId.product++, created: today(), name: data.name, cat: data.cat, brand: data.brand, sku: data.sku, cost: data.cost, price: data.price, qty: data.qty, min: data.min, supplier: data.supplier, lot: data.lot, expiry: data.expiry, note: data.note}); }
  saveData(DATA); closeModal(); openTab('prod'); showToast(id ? 'Produto atualizado' : 'Produto cadastrado');
}

function confirmBox(title, text, label, action) {
  openModal(modalHead(title) + '<div class="modal-bd"><p>' + text + '</p></div><div class="modal-ft"><button class="btn btn-o" onclick="closeModal()">Cancelar</button><button class="btn btn-d" onclick="' + action + '">' + label + '</button></div>');
}
function deleteProduct(id) { confirmBox('Excluir produto', 'Excluir <strong>' + esc(getProductName(id)) + '</strong>? Esta ação não pode ser desfeita.', 'Excluir produto', 'doDeleteProduct(' + id + ')'); }
function doDeleteProduct(id) {
  DATA.products = DATA.products.filter(function(p) { return p.id !== id; });
  saveData(DATA); closeModal(); openTab('prod'); showToast('Produto excluído');
}

// ============= MOVEMENT MODAL =============
function reasonOptions() { return Object.keys(REASONS).map(function(k) { return '<option value="' + k + '">' + REASONS[k] + '</option>'; }).join(''); }
function vendorOptions() { return '<option value="">Sem vendedor</option>' + DATA.vendors.map(function(v) { return '<option>' + esc(v) + '</option>'; }).join(''); }
function openMovementModal(pid, type) {
  DATA = loadData();
  var p = getProduct(pid), i = type === 'in';
  openModal(modalHead((i ? 'Entrada' : 'Saída') + ': ' + esc(p.name)) +
    '<div class="modal-bd"><div class="after"><span>Estoque atual</span><strong>' + p.qty + ' un</strong></div><div class="fr">' +
      '<div class="fg"><label for="mf_qty">Quantidade</label><input type="number" class="fi" id="mf_qty" min="1" max="' + (i ? '' : p.qty) + '"></div>' +
      (i ? '<div class="fg"><label for="mf_val">Valor total (R$)</label><input type="number" class="fi" id="mf_val" step="0.01"></div><div class="fg"><label for="mf_supplier">Fornecedor</label><input class="fi" id="mf_supplier" value="' + esc(p.supplier) + '"></div>' : '<div class="fg"><label for="mf_reason">Motivo</label><select class="fi fs" id="mf_reason">' + reasonOptions() + '</select></div>') +
      '<div class="fg"><label for="mf_date">Data</label><input type="date" class="fi" id="mf_date" value="' + today() + '"></div>' +
      '<div class="fg"><label for="mf_vendor">Vendedor</label><select class="fi fs" id="mf_vendor">' + vendorOptions() + '</select></div>' +
    '</div></div>' +
    '<div class="modal-ft"><button class="btn btn-o" onclick="closeModal()">Cancelar</button><button class="btn ' + (i ? 'btn-g' : 'btn-p') + '" onclick="saveMovement(' + pid + ',\'' + type + '\')">' + (i ? 'Registrar entrada' : 'Registrar saída') + '</button></div>');
}

function saveMovement(pid, type) {
  var q = parseInt(document.getElementById('mf_qty').value) || 0;
  if (q <= 0) { showToast('Informe uma quantidade válida', 'err'); return; }
  var p = getProduct(pid);
  if (type === 'out' && q > p.qty) { showToast('Estoque insuficiente: ' + p.qty + ' un disponíveis', 'err'); return; }
  p.qty += type === 'in' ? q : -q;
  DATA.movements.push({
    id: DATA.nextId.movement++,
    pid: pid, type: type, qty: q,
    val: type === 'in' ? (parseFloat(document.getElementById('mf_val') ? document.getElementById('mf_val').value : '0') || 0) : 0,
    date: document.getElementById('mf_date').value,
    supplier: type === 'in' ? (document.getElementById('mf_supplier') ? document.getElementById('mf_supplier').value.trim() : '') : '',
    note: '',
    reason: type === 'out' ? document.getElementById('mf_reason').value : '',
    vendor: document.getElementById('mf_vendor').value
  });
  saveData(DATA); closeModal();
  openTab(currentTab);
  showToast((type === 'in' ? 'Entrada' : 'Saída') + ' registrada: ' + p.name + ' agora tem ' + p.qty + ' un');
}

function closeModal() {
  var overlay = document.getElementById('modalOverlay');
  if (!overlay.classList.contains('on')) return;
  overlay.classList.remove('on');
  document.getElementById('modalBody').innerHTML = '';
  document.getElementById('mainContent').inert = false;
  document.getElementById('sidebar').inert = false;
  if (modalTrigger && modalTrigger.isConnected) modalTrigger.focus();
  modalTrigger = null;
}
document.getElementById('modalOverlay').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') { closeModal(); toggleSidebar(true); } });

// ============= STOCK IN =============
function productOptions() { return DATA.products.map(function(p) { return '<option value="' + p.id + '" data-max="' + p.qty + '">' + esc(p.name) + '</option>'; }).join(''); }
function updateAfter(pre, sign) {
  var s = document.getElementById(pre + '_prod'), q = parseInt(document.getElementById(pre + '_qty').value) || 0, cur = parseInt(s.selectedOptions[0].dataset.max) || 0;
  document.getElementById(pre + '_cur').textContent = cur + ' un';
  document.getElementById(pre + '_aft').textContent = (cur + sign * q) + ' un';
}
function renderStockIn(container) {
  var hist = DATA.movements.filter(function(m) { return m.type === 'in'; }).slice(-10).reverse();
  container.innerHTML = '<div class="split">' +
    '<div class="fcard"><h2>Registrar entrada</h2><div class="fr"><div class="fg full"><label for="si_prod">Produto</label><select class="fi fs" id="si_prod" onchange="updateAfter(\'si\',1)">' + productOptions() + '</select></div><div class="fg"><label for="si_qty">Quantidade</label><input type="number" class="fi" id="si_qty" min="1" oninput="updateAfter(\'si\',1)"></div><div class="fg"><label for="si_val">Valor total (R$)</label><input type="number" class="fi" id="si_val" step="0.01"></div><div class="fg"><label for="si_sup">Fornecedor</label><input class="fi" id="si_sup"></div><div class="fg"><label for="si_date">Data</label><input type="date" class="fi" id="si_date" value="' + today() + '"></div></div>' +
    '<div class="after"><span>Atual <strong id="si_cur"></strong></span><span>Depois <strong id="si_aft"></strong></span></div><button class="btn btn-g btn-w" onclick="saveStockIn()">Registrar entrada</button></div>' +
    '<div class="table-card"><div class="table-head"><h2>Últimas entradas</h2></div>' + (hist.length ? '<div class="table-wrap"><table class="resp" style="min-width:0"><thead><tr><th>Data</th><th>Produto</th><th class="r">Qtd</th><th class="r">Valor</th><th>Fornecedor</th></tr></thead><tbody>' + hist.map(function(m) { return '<tr><td class="lead strong">' + esc(getProductName(m.pid)) + '</td><td data-l="Data" class="num" style="order:-1">' + formatDate(m.date) + '</td><td data-l="Quantidade" class="r qty-in">+' + m.qty + '</td><td data-l="Valor" class="r">' + (m.val ? formatMoney(m.val) : '—') + '</td><td data-l="Fornecedor">' + esc(m.supplier || '—') + '</td></tr>'; }).join('') + '</tbody></table></div>' : emptyBox('in', 'Nenhuma entrada registrada')) + '</div></div>';
  fixHistHead(container);
  updateAfter('si', 1);
}

function saveStockIn() {
  var pid = parseInt(document.getElementById('si_prod').value);
  var q = parseInt(document.getElementById('si_qty').value) || 0;
  if (q <= 0) { showToast('Informe uma quantidade válida', 'err'); return; }

  DATA.movements.push({id: DATA.nextId.movement++, pid: pid, type: 'in', qty: q, val: parseFloat(document.getElementById('si_val').value) || 0, date: document.getElementById('si_date').value, supplier: document.getElementById('si_sup').value.trim(), note: '', reason: '', vendor: ''});
  saveData(DATA); openTab('entrada'); showToast('Entrada registrada');
}
// A primeira coluna do histórico é a data no desktop e o produto no cartão mobile
function fixHistHead(c) { var th = c.querySelector('.split thead tr'); if (th) th.insertBefore(th.children[1], th.children[0]); }

// ============= STOCK OUT =============
function renderStockOut(container) {
  var hist = DATA.movements.filter(function(m) { return m.type === 'out'; }).slice(-10).reverse();
  container.innerHTML = '<div class="split">' +
    '<div class="fcard"><h2>Registrar saída</h2><div class="fr"><div class="fg full"><label for="so_prod">Produto</label><select class="fi fs" id="so_prod" onchange="updateSoMax()">' + productOptions() + '</select></div><div class="fg"><label for="so_qty">Quantidade</label><input type="number" class="fi" id="so_qty" min="1" oninput="updateAfter(\'so\',-1)"><span class="fhint" id="so_max"></span></div><div class="fg"><label for="so_reason">Motivo</label><select class="fi fs" id="so_reason">' + reasonOptions() + '</select></div><div class="fg"><label for="so_vendor">Vendedor</label><select class="fi fs" id="so_vendor">' + vendorOptions() + '</select></div><div class="fg"><label for="so_date">Data</label><input type="date" class="fi" id="so_date" value="' + today() + '"></div></div>' +
    '<div class="after"><span>Atual <strong id="so_cur"></strong></span><span>Depois <strong id="so_aft"></strong></span></div><button class="btn btn-p btn-w" onclick="saveStockOut()">Registrar saída</button></div>' +
    '<div class="table-card"><div class="table-head"><h2>Últimas saídas</h2></div>' + (hist.length ? '<div class="table-wrap"><table class="resp" style="min-width:0"><thead><tr><th>Data</th><th>Produto</th><th class="r">Qtd</th><th>Motivo</th><th>Vendedor</th></tr></thead><tbody>' + hist.map(function(m) { return '<tr><td class="lead strong">' + esc(getProductName(m.pid)) + '</td><td data-l="Data" class="num" style="order:-1">' + formatDate(m.date) + '</td><td data-l="Quantidade" class="r qty-out">−' + m.qty + '</td><td data-l="Motivo">' + (REASONS[m.reason] || esc(m.reason) || '—') + '</td><td data-l="Vendedor">' + esc(m.vendor || '—') + '</td></tr>'; }).join('') + '</tbody></table></div>' : emptyBox('out', 'Nenhuma saída registrada')) + '</div></div>';

function updateSoMax() { var s = document.getElementById('so_prod'), mx = s.selectedOptions[0] ? s.selectedOptions[0].dataset.max : ''; document.getElementById('so_max').textContent = mx ? 'Disponível: ' + mx + ' un' : ''; document.getElementById('so_qty').max = mx || ''; updateAfter('so', -1); }
function saveStockOut() {
  var pid = parseInt(document.getElementById('so_prod').value), q = parseInt(document.getElementById('so_qty').value) || 0;

// ============= PEDIDOS POR VENDEDOR =============
function renderVendorOrders(container) {
  container.innerHTML =
    '<div class="chips" id="vendorTabs" style="margin-bottom:var(--s4)"><button class="chip on" onclick="filterByVendor(null, this)">Todos</button>' + DATA.vendors.map(function(v) { return '<button class="chip" onclick="filterByVendor(\'' + esc(v) + '\', this)">' + esc(v) + '</button>'; }).join('') + '</div>' +
    '<div id="vendorContent">' + buildVendorContent(null) + '</div>';
}
function buildVendorContent(vendor) {
  var ms = vendor ? DATA.movements.filter(function(m) { return m.type === 'out' && m.vendor === vendor; }) : DATA.movements.filter(function(m) { return m.type === 'out' && m.vendor; });
  var totalQty = ms.reduce(function(s, m) { return s + m.qty; }, 0);
  var totalVal = ms.reduce(function(s, m) { var p = getProduct(m.pid); return s + (p ? p.price * m.qty : 0); }, 0);
  return '<div class="stats"><div class="stat-card"><h3>Total vendido' + ic('box', 'ic-sm') + '</h3><div class="val">' + totalQty + ' un</div></div><div class="stat-card"><h3>Valor gerado' + ic('money', 'ic-sm') + '</h3><div class="val">' + formatMoney(totalVal) + '</div></div></div>' +
    '<div class="table-card">' + (ms.length ? '<div class="table-wrap"><table class="resp"><thead><tr><th>Produto</th><th>Data</th><th class="r">Qtd</th><th class="r">Preço un.</th><th class="r">Total</th><th>Vendedor</th></tr></thead><tbody>' +
      ms.slice(-15).reverse().map(function(m) { var p = getProduct(m.pid); return '<tr><td class="lead strong">' + esc(p ? p.name : '—') + '</td><td data-l="Data" class="num">' + formatDate(m.date) + '</td><td data-l="Quantidade" class="r">' + m.qty + '</td><td data-l="Preço un." class="r">' + (p ? formatMoney(p.price) : '—') + '</td><td data-l="Total" class="r strong">' + (p ? formatMoney(p.price * m.qty) : '—') + '</td><td data-l="Vendedor"><span class="badge badge-n">' + esc(m.vendor) + '</span></td></tr>'; }).join('') +
    '</tbody></table></div>' : emptyBox('list', 'Nenhuma venda registrada', 'As saídas por venda deste vendedor aparecem aqui.')) + '</div>';
}
function filterByVendor(v, btn) {
  var btns = document.querySelectorAll('#vendorTabs button');
  for (var i = 0; i < btns.length; i++) { btns[i].classList.remove('on'); }
  btn.classList.add('on');
  document.getElementById('vendorContent').innerHTML = buildVendorContent(v);
}

// ============= PROMOS =============
function renderPromos(container) {
  container.innerHTML =
    '<div class="toolbar"><h2>' + DATA.promos.length + ' promoções</h2><button class="btn btn-g btn-sm" onclick="openPromoModal()">' + ic('plus', 'ic-sm') + 'Nova promoção</button></div>' +
    (DATA.promos.length ? DATA.promos.map(function(pr) {
      return '<div class="notice"><div class="nic">' + ic('tag') + '</div><div class="nb"><h4>' + esc(pr.name) + ' · ' + (pr.type === 'pct' ? pr.val + '%' : formatMoney(pr.val)) + ' de desconto</h4><p>' + pr.pids.length + ' produtos · ' + formatDate(pr.start) + ' a ' + formatDate(pr.end) + '</p></div><span class="badge ' + (pr.active ? 'badge-ok' : 'badge-n') + '">' + (pr.active ? 'Ativa' : 'Pausada') + '</span><button class="btn btn-gh btn-ic is-danger" aria-label="Remover ' + esc(pr.name) + '" onclick="deletePromo(' + pr.id + ')">' + ic('trash', 'ic-sm') + '</button></div>';
    }).join('') : '<div class="card">' + emptyBox('tag', 'Nenhuma promoção criada', 'Crie uma promoção para destacar produtos.') + '</div>');
}
function openPromoModal() {
  DATA = loadData();
  openModal(modalHead('Nova promoção') + '<div class="modal-bd"><div class="fg"><label for="pr_name">Nome</label><input class="fi" id="pr_name" placeholder="Ex.: Seleção de ofertas"></div><div class="fr"><div class="fg"><label for="pr_type">Tipo</label><select class="fi fs" id="pr_type"><option value="pct">Porcentagem</option><option value="fix">Valor fixo</option></select></div><div class="fg"><label for="pr_val">Valor</label><input type="number" class="fi" id="pr_val" min="1"></div></div><div class="fr"><div class="fg"><label for="pr_start">Início</label><input type="date" class="fi" id="pr_start" value="' + today() + '"></div><div class="fg"><label for="pr_end">Fim</label><input type="date" class="fi" id="pr_end"></div></div><div class="fg"><span class="flabel">Produtos</span><div class="chk-l">' + DATA.products.map(function(p) { return '<label><input type="checkbox" value="' + p.id + '" class="pr_chk">' + esc(p.name) + '</label>'; }).join('') + '</div></div></div><div class="modal-ft"><button class="btn btn-o" onclick="closeModal()">Cancelar</button><button class="btn btn-g" onclick="savePromo()">Criar promoção</button></div>');
}
function savePromo() {
  var n = document.getElementById('pr_name').value.trim(), tp = document.getElementById('pr_type').value, v = parseFloat(document.getElementById('pr_val').value) || 0, s = document.getElementById('pr_start').value, e = document.getElementById('pr_end').value;
  if (!n || v <= 0 || !e) { showToast('Preencha nome, valor e data final', 'err'); return; }
  var ids = Array.from(document.querySelectorAll('.pr_chk:checked')).map(function(c) { return parseInt(c.value); });
  if (!ids.length) { showToast('Selecione ao menos um produto', 'err'); return; }
  DATA.promos.push({id: DATA.nextId.promo++, name: n, type: tp, val: v, start: s, end: e, pids: ids, active: true});
  saveData(DATA); closeModal(); openTab('promo'); showToast('Promoção criada');
}
function deletePromo(id) { DATA.promos = DATA.promos.filter(function(p) { return p.id !== id; }); saveData(DATA); openTab('promo'); showToast('Promoção removida'); }

// ============= ALERTS =============
function buildAlerts() {
  var alerts = [];
  DATA.products.forEach(function(p) {
    if (p.qty === 0) alerts.push({type: 'cr', icon: 'ban', pid: p.id, title: p.name + ': zerado', text: 'Reposição urgente. Fornecedor: ' + p.supplier});
    else if (p.qty <= p.min) alerts.push({type: 'wn', icon: 'alert', pid: p.id, title: p.name + ': estoque baixo', text: p.qty + ' de ' + p.min + ' un. Sugestão: pedir ' + (p.min * 2 - p.qty) + ' un.'});
    if (p.qty > 0 && expSoon(p)) alerts.push({type: 'in', icon: 'clock', title: p.name + ': vence em breve', text: 'Validade: ' + formatDate(p.expiry) + '. Priorize a venda (FIFO).'});
  });
  return alerts;
}
function renderAlerts(container) {
  DATA = loadData();
  var alerts = buildAlerts();
  function group(type, label) {
    var l = alerts.filter(function(a) { return a.type === type; });
    if (!l.length) return '';
    return '<div class="group-t">' + label + ' <span class="badge badge-n num">' + l.length + '</span></div>' + l.map(function(a) {
      return '<div class="notice ' + a.type + '"><div class="nic">' + ic(a.icon) + '</div><div class="nb"><h4>' + esc(a.title) + '</h4><p>' + esc(a.text) + '</p></div>' + (a.pid ? '<button class="btn btn-o btn-sm" onclick="openMovementModal(' + a.pid + ',\'in\')">Repor</button>' : '') + '</div>';
    }).join('');
  }
  container.innerHTML = alerts.length ? group('cr', 'Crítico') + group('wn', 'Atenção') + group('in', 'Validade') : '<div class="card">' + emptyBox('check', 'Nenhum alerta', 'Estoque e validades em dia.') + '</div>';
}

// ============= AI =============
function renderAI(container) {
  var sugs = [['+10 creatinas', 'Chegaram 10 creatinas Max Titanium'], ['−2 whey', 'Saiu 2 whey Max Titanium por venda'], ['O que está acabando?', 'Quais produtos estão acabando?'], ['O que repor?', 'O que preciso repor essa semana?'], ['Resumo', 'Resumo do estoque']];
  container.innerHTML =
    '<div class="ai-chat"><div class="ai-hd"><div class="mk">' + ic('spark', 'ic-sm') + '</div><div><strong>Assistente de estoque</strong><small>Nada é alterado sem a sua confirmação</small></div></div>' +
    '<div class="ai-msgs" id="aiMsgs" aria-live="polite"><div class="ai-msg a">Olá! Você pode escrever comandos como <strong>Chegaram 10 creatinas</strong>, <strong>Saiu 2 whey por venda</strong>, <strong>O que repor?</strong> ou <strong>Resumo</strong>.</div></div>' +
    '<div class="ai-sugs">' + sugs.map(function(s) { return '<button class="chip" onclick="sendAI(\'' + s[1] + '\')">' + s[0] + '</button>'; }).join('') + '</div>' +
    '<div class="ai-input"><input class="fi" id="aiInput" aria-label="Mensagem para o assistente" placeholder="Digite um comando" onkeydown="if(event.key===\'Enter\')sendAI()"><button class="btn btn-p btn-ic" style="min-height:40px;width:40px" aria-label="Enviar" onclick="sendAI()">' + ic('send', 'ic-sm') + '</button></div></div>';
}
function aiScroll() { var m = document.getElementById('aiMsgs'); if (m) m.scrollTop = m.scrollHeight; }
function aiAdd(html) { document.getElementById('aiMsgs').insertAdjacentHTML('beforeend', html); aiScroll(); }
function sendAI(text) {
  var inp = text || document.getElementById('aiInput').value.trim();
  if (!inp) return;
  var msgs = document.getElementById('aiMsgs');
  if (!msgs) { openTab('ia'); setTimeout(function() { sendAI(text); }, 80); return; }
  if (aiPendingAction) { aiPendingAction = null; closePend(); }
  aiAdd('<div class="ai-msg u">' + esc(inp) + '</div><div class="ai-msg a ai-typing" id="aiTyp" aria-label="Processando"><i></i><i></i><i></i></div>');
  var i = document.getElementById('aiInput'); if (i) i.value = '';
  setTimeout(function() {
    var t = document.getElementById('aiTyp'); if (t) t.remove();
    if (!document.getElementById('aiMsgs')) return;
    var r = processAI(inp);
    if (r.confirm) {
      aiPendingAction = r.action;
      aiAdd('<div class="ai-msg c" id="aiPend"><div class="tag">' + ic('clock', 'ic-sm') + 'Sugestão: aguardando sua confirmação</div>' + r.msg + '<div class="acts"><button class="btn btn-g btn-sm" onclick="confirmAI()">' + ic('check', 'ic-sm') + 'Confirmar</button><button class="btn btn-o btn-sm" onclick="cancelAI()">Cancelar</button></div></div>');
    } else {
      aiAdd('<div class="ai-msg a">' + r.msg + '</div>');
    }
  }, 420);
}
function processAI(inp) {
  DATA = loadData(); var l = inp.toLowerCase();
  var m = l.match(/(chegaram|chegou|entrada)\s*(\d+)\s*(.+)/i);
  if (m) { var q = parseInt(m[2]), nm = m[3].trim(), p = findProduct(nm); if (p) return {confirm:true,msg:'<strong>+' + q + ' un</strong> de <strong>' + esc(p.name) + '</strong>. Estoque: ' + p.qty + ' → ' + (p.qty + q) + '.',action:{tp:'in',pid:p.id,q:q}}; return {confirm:false,msg:'Não encontrei "' + esc(nm) + '".'}; }
  m = l.match(/(saiu|saída)\s*(\d+)\s*(.+?)(\s*por\s+(venda|perda|uso|ajuste))?$/i);
  if (m) { var q = parseInt(m[2]), nm = m[3].trim(), rs = m[5] || 'venda', p = findProduct(nm); if (p) { if (q > p.qty) return {confirm:false,msg:'Só há ' + p.qty + ' un de ' + esc(p.name) + '.'}; return {confirm:true,msg:'<strong>−' + q + ' un</strong> de <strong>' + esc(p.name) + '</strong> (' + REASONS[rs].toLowerCase() + '). Estoque: ' + p.qty + ' → ' + (p.qty - q) + '.',action:{tp:'out',pid:p.id,q:q,rs:rs}}; } return {confirm:false,msg:'Não encontrei "' + esc(nm) + '".'}; }
  if (l.match(/repor|acabando/)) { var nd = DATA.products.filter(function(p) { return p.qty <= p.min; }); return {confirm:false,msg:nd.length ? 'Para repor:<br>' + nd.map(function(p) { return '• ' + esc(p.name) + ': ' + Math.max(p.min * 2 - p.qty, 10) + ' un (' + esc(p.supplier) + ')'; }).join('<br>') : 'Nada a repor no momento.'}; }
  if (l.match(/resumo/)) { return {confirm:false,msg:DATA.products.length + ' produtos · ' + formatMoney(DATA.products.reduce(function(s,p) { return s + (p.qty * p.cost); }, 0)) + ' em estoque · ' + 'zerados: ' + DATA.products.filter(function(p) { return p.qty === 0; }).length + ' · pedidos pendentes: ' + DATA.orders.filter(function(o) { return o.status === 'pendente'; }).length}; }
  return {confirm:false,msg:'Não entendi. Tente: Chegaram 10 creatinas, Saiu 2 whey, O que repor? ou Resumo.'};
}
function findProduct(q) {
  var words = q.toLowerCase().split(/\s+/).filter(Boolean);
  return DATA.products.find(function(p) {
    var hay = (p.name + ' ' + p.brand).toLowerCase();
    return words.every(function(w) { return hay.indexOf(w) >= 0 || hay.indexOf(w.replace(/s$/, '')) >= 0; });
  }) || null;
}
function closePend() { var p = document.getElementById('aiPend'); if (p) { var a = p.querySelector('.acts'); if (a) a.remove(); p.querySelector('.tag').lastChild.textContent = 'Sugestão encerrada'; p.removeAttribute('id'); } }
function confirmAI() {
  if (!aiPendingAction) return; var a = aiPendingAction; DATA = loadData(); var p = getProduct(a.pid);
  if (a.tp === 'in') { p.qty += a.q; DATA.movements.push({id:DATA.nextId.movement++,pid:a.pid,type:'in',qty:a.q,val:0,date:today(),supplier:p.supplier,note:'Assistente IA',reason:'',vendor:''}); }
  else { p.qty -= a.q; DATA.movements.push({id:DATA.nextId.movement++,pid:a.pid,type:'out',qty:a.q,val:0,date:today(),supplier:'',note:'Assistente IA',reason:a.rs,vendor:''}); }
  saveData(DATA); aiPendingAction = null; closePend();
  aiAdd('<div class="ai-msg d"><div class="tag">' + ic('check', 'ic-sm') + 'Registrado no estoque</div>' + (a.tp === 'in' ? '+' : '−') + a.q + ' un de ' + esc(p.name) + '. Estoque atual: ' + p.qty + ' un.</div>');
  renderNav(); showToast('Movimentação registrada');
}
function cancelAI() { aiPendingAction = null; closePend(); aiAdd('<div class="ai-msg a">Cancelado. Nenhuma alteração foi feita.</div>'); }

// ============= REPORTS =============
function renderReports(container) {
  var tv = DATA.products.reduce(function(s,p) { return s + (p.qty * p.cost); }, 0);
  var lo = DATA.products.filter(function(p) { return p.qty > 0 && p.qty <= p.min; }).length;
  var ze = DATA.products.filter(function(p) { return p.qty === 0; }).length;
  var limit = repDays ? new Date(Date.now() - repDays * 864e5).toISOString().split('T')[0] : '';
  var oc = {}; DATA.movements.filter(function(m) { return m.type === 'out' && m.date >= limit; }).forEach(function(m) { oc[m.pid] = (oc[m.pid] || 0) + m.qty; });
  var top = Object.entries(oc).sort(function(a,b) { return b[1] - a[1]; }).slice(0, 6);
  container.innerHTML =
    '<div class="stats"><div class="stat-card lead"><h3>Valor em estoque' + ic('money', 'ic-sm') + '</h3><div class="val">' + formatMoney(tv) + '</div><div class="sub">pelo preço de custo</div></div><div class="stat-card"><h3>Cadastrados' + ic('box', 'ic-sm') + '</h3><div class="val">' + DATA.products.length + '</div></div><div class="stat-card' + (lo ? ' is-w' : '') + '"><h3>Estoque baixo' + ic('alert', 'ic-sm') + '</h3><div class="val">' + lo + '</div></div><div class="stat-card' + (ze ? ' is-c' : '') + '"><h3>Zerados' + ic('ban', 'ic-sm') + '</h3><div class="val">' + ze + '</div></div></div>' +
    '<div class="chart-row"><div class="chart-card"><div class="card-hd"><h3>Produtos com mais saídas</h3><div class="chips">' + [[0, 'Tudo'], [30, '30 dias'], [90, '90 dias'], [180, '180 dias']].map(function(o) { return '<button class="chip' + (repDays === o[0] ? ' on' : '') + '" onclick="repDays=' + o[0] + ';openTab(\'rel\')">' + o[1] + '</button>'; }).join('') + '</div></div>' + (top.length ? chartBox('chart1') : emptyBox('chart', 'Sem saídas no período', 'Escolha um período maior.')) + '</div>' +
    '<div class="chart-card"><div class="card-hd"><h3>Estoque em relação ao mínimo</h3></div><ul class="row-list">' + DATA.products.map(function(p) { return '<li class="row-it"><span class="grow">' + esc(p.name) + '</span><div class="bar" style="width:90px;flex:none"><i class="' + (p.qty === 0 ? 'c' : p.qty <= p.min ? 'w' : '') + '" style="width:' + Math.min(100, (p.qty / Math.max(p.min, 1)) * 100) + '%"></i></div><span class="meta num" style="min-width:52px;text-align:right">' + p.qty + ' / ' + p.min + '</span></li>'; }).join('') + '</ul></div></div>';
  if (top.length) drawChart('chart1', {type:'bar',data:{labels:top.map(function(d) { var n = getProductName(parseInt(d[0])); return n.length > 24 ? n.slice(0, 23) + '…' : n; }),datasets:[{label:'Unidades',data:top.map(function(d) { return d[1]; }),backgroundColor:'#141414',borderRadius:4,maxBarThickness:22}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,border:{display:false},grid:{color:'#EFEDE8'},ticks:{precision:0}},y:{grid:{display:false}}}}});
}

// ============= FIFO =============
function renderFIFO(container) {
  var sorted = [].concat(DATA.products).sort(function(a,b) { if (!a.expiry) return 1; if (!b.expiry) return -1; return new Date(a.expiry + 'T00:00:00') - new Date(b.expiry + 'T00:00:00'); });
  var near = sorted.filter(function(p) { return expSoon(p) && p.qty > 0; });
  container.innerHTML =
    '<div class="banner">' + ic('clock', 'ic-lg') + '<div><h3>Primeiro que vence, primeiro que sai</h3><p>' + near.length + (near.length === 1 ? ' produto vence' : ' produtos vencem') + ' em até 2 meses. Priorize a venda desses lotes.</p></div></div>' +
    '<div class="table-card"><div class="table-head"><h2>Ordenado por validade</h2></div><div class="table-wrap"><table class="resp"><thead><tr><th>Produto</th><th>Ordem</th><th>Lote</th><th>Validade</th><th class="r">Estoque</th><th class="r">Prazo</th><th>Situação</th></tr></thead><tbody>' +
      sorted.map(function(p,i) {
        var dias = p.expiry ? Math.ceil((new Date(p.expiry + 'T00:00:00') - new Date()) / (1000 * 60 * 60 * 24)) : null;
        var st = p.qty === 0 ? ['badge-c', 'Zerado'] : dias !== null && dias < 0 ? ['badge-c', 'Vencido'] : i < 3 ? ['badge-c', 'Urgente'] : i < 6 ? ['badge-w', 'Atenção'] : ['badge-ok', 'OK'];
        return '<tr><td class="lead strong">' + esc(p.name) + '</td><td data-l="Ordem" class="num">' + (i + 1) + 'º</td><td data-l="Lote" class="code">' + esc(p.lot || '—') + '</td><td data-l="Validade" class="num">' + formatDate(p.expiry) + '</td><td data-l="Estoque" class="r">' + p.qty + '</td><td data-l="Prazo" class="r">' + (dias === null ? '—' : dias < 0 ? 'há ' + (-dias) + ' dias' : dias + ' dias') + '</td><td data-l="Situação"><span class="badge ' + st[0] + '">' + st[1] + '</span></td></tr>';
      }).join('') +
    '</tbody></table></div></div>';
}

function renderConfig(container) {
  var c = DATA.company || {name: 'MaxDistrib', email: 'contato@maxdistrib.com.br', phone: '(81) 99901-2345', cnpj: ''};
  container.innerHTML =

    '<div class="fcard"><h2>Integrações previstas</h2>' + ['Banco de dados PostgreSQL', 'Login de usuários', 'Leitura de PDF, Excel e foto', 'WhatsApp automático', 'Assistente com modelo de IA'].map(function(s) { return '<div class="intg"><span>' + s + '</span><span class="badge badge-n">Em breve</span></div>'; }).join('') + '</div></div>';
}
function saveConfig() {
  DATA.company = {name: document.getElementById('cf_name').value.trim(), email: document.getElementById('cf_email').value.trim(), phone: document.getElementById('cf_phone').value.trim(), cnpj: document.getElementById('cf_cnpj').value.trim()};
  saveData(DATA); showToast('Dados salvos');
}

openTab('dash');
</script>
