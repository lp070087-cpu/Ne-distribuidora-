name: Portal MaxDistrib
on:
  push:
    branches: [main, work/maxdistrib-portal]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  portal-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: maxdistrib_test
          POSTGRES_PASSWORD: isolated_ci_password
          POSTGRES_DB: maxdistrib_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U maxdistrib_test"
          --health-interval 5s --health-timeout 4s --health-retries 12
    env:
      MAXDISTRIB_DATABASE_URL: postgres://maxdistrib_test:isolated_ci_password@localhost:5432/maxdistrib_test
      MAXDISTRIB_TEST_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run migrate
      - run: npm run migrate
      - run: npm test
      - run: npm run build
      - run: test -f dist/minha-conta.html && test -f dist/assets/portal.js && test ! -e dist/server
